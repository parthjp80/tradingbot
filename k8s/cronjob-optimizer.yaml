# Mines trade_journal.csv weekly and, if it recommends parameter changes,
# opens a PR for review (see autotune.sh) -- never pushes directly to main.
# Mounts tradingbot-data READ-ONLY: a buggy optimizer run is structurally
# incapable of corrupting the live journal/position state, on top of
# whatever application-level safeguards optimizer.py already has (rate
# limiting, hard bounds, invariant validation before writing anything).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tradingbot-optimizer
  namespace: trading
  labels:
    app: tradingbot
    component: optimizer
spec:
  # Weekly, Monday 7am ET -- same cadence as lowfloat_trader's optimizer.
  schedule: "0 7 * * 1"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: tradingbot
            component: optimizer
        spec:
          restartPolicy: OnFailure
          containers:
            - name: optimizer
              image: ghcr.io/parthjp80/tradingbot-optimizer:latest
              imagePullPolicy: Always

              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: tradingbot-optimizer-secrets
                      key: GITHUB_TOKEN
                # gh CLI reads GH_TOKEN or GITHUB_TOKEN automatically for
                # non-interactive auth -- no `gh auth login` step needed.
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: tradingbot-optimizer-secrets
                      key: GITHUB_TOKEN

              volumeMounts:
                - name: data
                  mountPath: /app/data
                  readOnly: true

              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: tradingbot-data
                readOnly: true
